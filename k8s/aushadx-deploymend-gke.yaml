kind: Deployment
metadata:
  name: medicine-analyzer
  namespace: aushadx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicine-analyzer
  template:
    metadata:
      labels:
        app: medicine-analyzer
    spec:
      serviceAccountName: aushadx-agent
      containers:
        - name: medicine-analyzer
          image: asia-south1-docker.pkg.dev/aushadx-489507/aushadx/medicine-analyzer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: "production"
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: LLM_PROVIDER
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: LLM_MODEL
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: LOG_LEVEL
            - name: PROFILE_SERVICE_HOST
              value: "profile-manager"
            - name: PROFILE_SERVICE_PORT
              value: "3001"
            - name: PROFILE_SERVICE_URL
              value: "http://$(PROFILE_SERVICE_HOST):$(PROFILE_SERVICE_PORT)"
            - name: PROPAGATE_AUTH
              value: "true"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: GEMINI_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: OPENAI_API_KEY
            - name: PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: PINECONE_API_KEY
            - name: PINECONE_INDEX
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: PINECONE_INDEX
            - name: PINECONE_INDEX_HOST
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: PINECONE_INDEX_HOST
            - name: PINECONE_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: PINECONE_NAMESPACE
            - name: GEMINI_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: GEMINI_PROVIDER
            - name: VERTEX_PROJECT
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: VERTEX_PROJECT
            - name: VERTEX_LOCATION
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: VERTEX_LOCATION
          # No GOOGLE_APPLICATION_CREDENTIALS – Workload Identity injects credentials
          # No vertex-ai-key volume – Workload Identity replaces the JSON key file
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: medicine-analyzer
  namespace: aushadx
spec:
  type: ClusterIP
  selector:
    app: medicine-analyzer
  ports:
    - port: 3002
      targetPort: 3002

