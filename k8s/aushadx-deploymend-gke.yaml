# ════════════════════════════════════════════════════════════
# medicine-scheduler-worker (Daemon)
# Auth: Workload Identity via aushadx-firebase-sa (no key file)
# ════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicine-scheduler-worker
  namespace: aushadx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicine-scheduler-worker
  template:
    metadata:
      labels:
        app: medicine-scheduler-worker
    spec:
      serviceAccountName: aushadx-firebase-sa
      containers:
        - name: medicine-scheduler-worker
          image: asia-south1-docker.pkg.dev/aushadx-489507/aushadx/medicine-scheduler:latest
          imagePullPolicy: Always
          command: ["npm", "run", "worker"]
          env:
            - name: NODE_ENV
