# ============================================================
# AushadX – Kubernetes Manifests for GKE
# Services: mongodb, api-server, profile-manager,
#            medicine-analyzer, medicine-scheduler, agent-service
#
# Registry : asia-south1-docker.pkg.dev/aushadx-489507/aushadx
# Project  : aushadx-489507
# Region   : asia-south1
#
# Auth     : Workload Identity (no JSON key files)
#   aushadx-agent        → aushadx-vertex@aushadx-489507    (Vertex AI)
#   aushadx-firebase-sa  → aushadx-firebase@<FIREBASE_PROJECT> (Firebase)
#
# Secrets  : managed externally via `kubectl create secret`
#            (do NOT store secret values in this file)
# ============================================================

---
# ─── Namespace ───────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: aushadx

---
# ─── Service Account (agent-service / medicine-analyzer → Vertex AI) ─
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aushadx-agent
  namespace: aushadx
  annotations:
    iam.gke.io/gcp-service-account: aushadx-vertex@aushadx-489507.iam.gserviceaccount.com

---
# ─── Service Account (medicine-scheduler → Firebase) ─────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aushadx-firebase-sa
  namespace: aushadx
  annotations:
    iam.gke.io/gcp-service-account: aushadx-firebase@aushadx-99a97.iam.gserviceaccount.com

---
# ════════════════════════════════════════════════════════════
# MongoDB – PVC, StatefulSet, Service
# ════════════════════════════════════════════════════════════
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: aushadx
spec:
  storageClassName: standard-rwo   # GKE managed disk (replaces Minikube default)
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: aushadx
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: aushadx
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: aushadx
spec:
  clusterIP: None  # Headless – StatefulSet DNS: mongodb.aushadx.svc.cluster.local
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017

---
# ════════════════════════════════════════════════════════════
# profile-manager (port 3001)
# ════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-manager
  namespace: aushadx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-manager
  template:
    metadata:
      labels:
        app: profile-manager
    spec:
      containers:
        - name: profile-manager
          image: asia-south1-docker.pkg.dev/aushadx-489507/aushadx/profile-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: JWT_SECRET
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: JWT_REFRESH_SECRET
            - name: JWT_ACCESS_EXPIRES_IN
              value: "15m"
            - name: JWT_REFRESH_EXPIRES_IN
              value: "7d"
            - name: OTP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: OTP_JWT_SECRET
            - name: OTP_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: OTP_EXPIRES_IN
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: SENDGRID_API_KEY
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: SENDGRID_FROM_EMAIL
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: profile-manager
  namespace: aushadx
spec:
  type: ClusterIP
  selector:
    app: profile-manager
  ports:
    - port: 3001
      targetPort: 3001

---
# ════════════════════════════════════════════════════════════
# medicine-analyzer (port 3002)
# Auth: Workload Identity via aushadx-agent SA (no key file)
# ════════════════════════════════════════════════════════════
