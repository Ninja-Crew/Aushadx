---
# ════════════════════════════════════════════════════════════
# api-server / API Gateway (port 3000) – Exposed via Ngrok
# ════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: aushadx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: asia-south1-docker.pkg.dev/aushadx-489507/aushadx/api-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            # ── profile-manager ────────────────────────────
            - name: PROFILE_SERVICE_HOST
              value: "profile-manager"
            - name: PROFILE_SERVICE_PORT
              value: "3001"
            - name: PROFILE_SERVICE_URL
              value: "http://$(PROFILE_SERVICE_HOST):$(PROFILE_SERVICE_PORT)"
            - name: JWKS_URI
              value: "http://$(PROFILE_SERVICE_HOST):$(PROFILE_SERVICE_PORT)/.well-known/jwks.json"
            # ── medicine-scheduler ─────────────────────────
            - name: MEDICINE_SCHEDULER_HOST
              value: "medicine-scheduler"
            - name: MEDICINE_SCHEDULER_PORT
              value: "3003"
            - name: MEDICINE_SCHEDULER_URL
              value: "http://$(MEDICINE_SCHEDULER_HOST):$(MEDICINE_SCHEDULER_PORT)"
            # ── medicine-analyzer ──────────────────────────
            - name: MEDICINE_ANALYZER_HOST
              value: "medicine-analyzer"
            - name: MEDICINE_ANALYZER_PORT
              value: "3002"
            - name: MEDICINE_ANALYZER_URL
              value: "http://$(MEDICINE_ANALYZER_HOST):$(MEDICINE_ANALYZER_PORT)"
            # ── agent-service (WebSocket) ──────────────────
            - name: AGENT_SERVICE_HOST
              value: "agent-service"
            - name: AGENT_SERVICE_PORT
              value: "3004"
            - name: AGENT_SERVICE_URL
              value: "ws://$(AGENT_SERVICE_HOST):$(AGENT_SERVICE_PORT)"
            # ── Stability: ignore proxy errors so pod stays up ─
            - name: NODE_ENV
              value: "production"
            # ── Timeouts ──────────────────────────────────
            - name: TIMEOUT_AUTH
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: TIMEOUT_AUTH
            - name: TIMEOUT_PROFILE
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: TIMEOUT_PROFILE
            - name: TIMEOUT_REMINDERS
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: TIMEOUT_REMINDERS
            - name: TIMEOUT_ANALYZE
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: TIMEOUT_ANALYZE
            - name: TIMEOUT_AGENT
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: TIMEOUT_AGENT
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: aushadx
spec:
  type: ClusterIP             # Changed from LoadBalancer to ClusterIP for ngrok tunnel
  selector:
    app: api-server
  ports:
    - port: 3000              # Internal service port
      targetPort: 3000        # Internal container port

---
# ════════════════════════════════════════════════════════════
# ngrok (Tunnel to api-server)
# ════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok
  namespace: aushadx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngrok
  template:
    metadata:
      labels:
        app: ngrok
    spec:
      containers:
        - name: ngrok
          image: ngrok/ngrok:latest
          args:
            - "http"
            - "api-server:3000"
          env:
            - name: NGROK_AUTHTOKEN
              valueFrom:
                secretKeyRef:
                  name: aushadx-secrets
                  key: NGROK_AUTHTOKEN
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

---
# ════════════════════════════════════════════════════════════
# NetworkPolicy: Restrict api-server access to ngrok only
# ════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-server-allow-ngrok
  namespace: aushadx
spec:
  podSelector:
    matchLabels:
      app: api-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ngrok
      ports:
        - protocol: TCP
          port: 3000

---
# ════════════════════════════════════════════════════════════
# HorizontalPodAutoscalers
# Scales stateless services based on CPU ≥ 70% utilisation.
# Prerequisites:
#   1. Metrics Server must be enabled on the cluster:
#      gcloud container clusters update aushadx-cluster --enable-autoscaling \
#        --min-nodes=1 --max-nodes=5 --region=asia-south1
#   2. Every Deployment below MUST have resource requests set (done above).
# ════════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-server-hpa
  namespace: aushadx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-server
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: profile-manager-hpa
  namespace: aushadx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: profile-manager
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medicine-analyzer-hpa
  namespace: aushadx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medicine-analyzer
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-service-hpa
  namespace: aushadx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medicine-scheduler-hpa
  namespace: aushadx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medicine-scheduler
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
